include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Treat missing returns as errors, not warnings.
    missing_return: error
    # Enforce use of Either — catch any accidental exception throws at layer boundaries.
    avoid_catches_without_on_clauses: warning
  exclude:
    # Exclude generated files from analysis.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/core/di/injection.config.dart"
    - build/**
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    # ── Style ──────────────────────────────────────────────────────────────
    prefer_single_quotes: true
    directives_ordering: true
    always_use_package_imports: true
    # ── Architecture guards ────────────────────────────────────────────────
    avoid_print: true
    # ── Null safety ────────────────────────────────────────────────────────
    prefer_null_aware_operators: true
    # ── BLoC consistency ──────────────────────────────────────────────────
    # No setState outside of pure local UI concerns.
    # (Enforced by code review — no automated lint for this exists.)
