name: ironlink
description: "Ascent — coach dashboard (web) + client app (mobile) from one shared Flutter codebase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Backend ────────────────────────────────────────────────────────────────
  supabase_flutter: ^2.8.4

  # ── State management ───────────────────────────────────────────────────────
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0

  # ── Code-gen annotations (runtime) ────────────────────────────────────────
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # ── Dependency injection ───────────────────────────────────────────────────
  get_it: ^8.0.3
  injectable: ^2.5.0

  # ── Routing ────────────────────────────────────────────────────────────────
  go_router: ^14.8.1

  # ── Functional programming (Either<Failure, T>) ────────────────────────────
  fpdart: ^1.1.1

  # ── Environment / secrets ─────────────────────────────────────────────────
  flutter_dotenv: ^5.2.1
  fl_chart: ^1.2.0
  rxdart: ^0.28.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.3.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # ── Code generation ────────────────────────────────────────────────────────
  build_runner: ^2.4.10
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  injectable_generator: ^2.7.0

  # ── Testing ────────────────────────────────────────────────────────────────
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  uuid: ^4.6.0

flutter:
  uses-material-design: true

  assets:
    - .env
